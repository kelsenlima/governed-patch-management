# =============================================================================
# Inventário de EXEMPLO — servidores Linux da esteira (troque pelos seus)
# -----------------------------------------------------------------------------
# - ansible_host = o IP que aparece no Qualys (a detecção é casada pelo IP).
# - O grupo define o ambiente: "producao" ou "nao_producao".
# - Para incluir um servidor: adicione aqui (via PR), garanta a tag do Qualys
#   (ex.: DEB-PROD / DEB-NPROD / RHEL-PROD) e a chave pública do Ansible no root.
# - O agente das pipelines (agent-01, 10.20.0.25) fica FORA: atualizar o próprio
#   agente no meio do job derruba a execução.
# =============================================================================
all:
  vars:
    ansible_user: root
    ansible_python_interpreter: auto_silent
  children:
    linux:
      children:
        producao:
          hosts:
            web-prd-01:   { ansible_host: 10.20.1.11 }   # Ubuntu 22.04 · nginx + php-fpm
            web-prd-02:   { ansible_host: 10.20.1.12 }   # Ubuntu 22.04 · kernel congelado de propósito (exemplo)
            app-prd-01:   { ansible_host: 10.20.2.21 }   # Debian 12 · apache2 + mysql
            proxy-prd-01: { ansible_host: 10.20.4.15 }   # Rocky Linux 8 (dnf)
        nao_producao:
          hosts:
            web-hml-01:   { ansible_host: 10.20.1.21 }
            app-hml-01:   { ansible_host: 10.20.2.22 }
            web-hml-02:   { ansible_host: 10.20.1.22 }   # sem acesso ainda (ver LINUX_PENDENTES nos testes)
